p2_pad=1
idle_pad=3
auto_possess=0
block_saves=0
debug_log=0
# Over Steam (each player runs their own game on their own PC): remove the # on the line that fits.
# 2 to 4 players: the host plays the Arisen; each guest (a Steam friend of the host, up to three)
# replaces a pawn with their own character. Friends can join while the host plays (the host's game
# saves and reloads once to bring their characters in). Only the host saves: a guest's game never
# saves while role=guest. A friend who adds send_character=0 plays the host's pawn as it is.
#role=host
#role=guest
transport=steam
guest_cam_pawn=1
# Shared world (default): every player plays their own character and goes where they want, with quests,
# gear, loot and experience shared. shared_world=0 gives the old classic mode (a guest drives a host pawn).
shared_world=1
# Monsters, human foes (bandits) and NPCs are run by the host's game for everyone; no_npc_sync=1 shares
# monsters only. The pause menu does not stop the world in co-op; menu_runs_world=0 gives the old pause.
#no_npc_sync=1
#menu_runs_world=0
